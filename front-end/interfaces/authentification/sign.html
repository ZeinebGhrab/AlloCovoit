<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlloCovoit - Partagez vos trajets</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/style.css">
    <script type="module" src="../../script/authentification/sign.js"></script>
</head>
<body>
    <!-- Cercles décoratives -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
    <div class="circle circle-4"></div>

      <!-- Navigation -->
    <nav>
        <div class="logo">Allo<span>Covoit</span></div>
    </nav>
    
        <!-- Page d'inscription -->
        <div class="form">
            <div class="login-card">
                <div class="logo-container">
                    <i class="fas fa-user-plus"></i>
                    <h2>Inscription</h2>
                </div> 
            <form id="loginForm" action="../../../back-end/authentification/save.php" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nom </label>
                    <input type="text" name="nom" placeholder="Nom" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Prenom</label>
                    <input type="text" name="prenom" placeholder="Prenom" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" name="email" placeholder="votre@email.com" required /> 
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Téléphone</label>
                    <input type="tel" name="telephone" placeholder="+216 12 345 678" required/>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Mot de passe</label>
                    <input type="password" name="mot_passe" placeholder="••••••••" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Confirme Mot de passe</label>
                    <input type="password" name="confirme_mot_passe" placeholder="••••••••" required />
                </div>
                <!-- Zone pour afficher les erreurs -->
                <div id="errorMessage" style="color: #ef4444; margin-bottom: 15px; display: none;"></div>
                <div>
                    <button class="btn" type="submit"><i class="fas fa-check"></i> S'inscrire</button>
                </div>
            </form>
            <div class="signup-section">
            Vous avez de compte ? <a href="./login.html" class="signup-link">Connectez-vous ici</a>
           </div>
            </div>
        </div>
        <footer>
        <p>© 2025 AlloCovoit. Tous droits réservés.</p>
        <div class="footer-links">
            <a href="#confidentialite">Politique de confidentialité</a>
            <a href="#conditions">Conditions d'utilisation</a>
            <a href="#support">Support</a>
        </div>
    </footer>
    </body>
</html>
